name: Build Chrome extension

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

# Default-deny: each job opts into exactly what it needs, so ordinary PR and
# branch builds never hold a token that could write a release.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; tag and main builds are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs, not tags. A floating major like @v7
# is a mutable ref that maintainers move on every patch release, so it is not a
# fixed version — retagging is how the tj-actions/changed-files compromise
# (March 2025) reached ~23k repos. That matters most for the release job below,
# which holds attestations: write — a moved tag there could get a malicious ZIP
# attested as genuine, defeating the verification the README tells users to
# trust. The trailing comment on each pin is the human-readable version;
# .github/dependabot.yml keeps the SHAs current.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension ZIP
        id: package
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('src/manifest.json', 'utf8')).version")"
          archive="linkosh-chrome-v${version}.zip"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}." >&2
            exit 1
          fi

          # Zip the *contents* of dist/src, so manifest.json lands at the ZIP
          # root — the README's install steps depend on there being no wrapper
          # directory. -X drops uid/gid and extra attributes; the archive is
          # still not byte-reproducible (mtimes vary run to run).
          (cd dist/src && zip -q -r -X "${GITHUB_WORKSPACE}/${archive}" .)
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkosh-chrome-extension
          path: dist/src/
          if-no-files-found: error

      # The release job publishes these exact bytes rather than rebuilding, so
      # what ships is what `npm test` ran against.
      - name: Upload release ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkosh-chrome-zip
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # OIDC token the attestation is signed against
      attestations: write
    steps:
      - name: Download release ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linkosh-chrome-zip

      # Binds the ZIP's digest to this repo, workflow and commit. This — not
      # the .sha256, which travels beside the ZIP — is what lets a user verify
      # a download really came from here (`gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.archive }}

      - name: Attach ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no actions/checkout — it only needs the artifact — so
          # there is no git remote for gh to infer the repository from, and it
          # exits with "not a git repository". GH_REPO supplies it directly,
          # which is cheaper than cloning the repo just to run gh.
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        shell: bash
        run: |
          # Created as a draft on purpose: a human reviews the generated notes
          # and the attached ZIP, then publishes. Until then GitHub does not
          # serve it as /releases/latest.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ARCHIVE}" "${ARCHIVE}.sha256" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${ARCHIVE}" "${ARCHIVE}.sha256" \
              --draft --verify-tag --generate-notes --title "Linkosh ${GITHUB_REF_NAME}"
          fi
